# Standalone compose for local/simple hosting. On the VPS this service is instead part of
# ~/works/projects-manage/docker-compose.yaml, behind Caddy.
services:
  web:
    build:
      context: .
      args:
        VITE_API_MODE: ${VITE_API_MODE:-http}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.baeclatant.com/ms/sudous/api/v1}
    image: baec-sudoku-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8082}:80"

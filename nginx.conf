server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (Vite fingerprints these) are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidate index.html so a redeploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Invite links look like /?join=CODE; any other path falls back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
